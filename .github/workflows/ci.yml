name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# One pipeline per ref. PR runs are superseded by newer pushes; main runs queue
# so two deploys never race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}-server
  DEPLOY_HOST: 107.170.74.122
  DEPLOY_USER: baes
  PUBLIC_URL: https://music.sebby.dev

jobs:
  checks:
    name: Lint, build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm --filter @baes/mobile typecheck
      - run: pnpm -r test

  image:
    name: Build & push server image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key for the droplet — no trust-on-first-use.
          echo "$DEPLOY_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILdapc23g9JO14vUo39LaE14BMpwG46O8aLLPg4mxsMs" >> ~/.ssh/known_hosts

      - name: Pull image and restart server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SHA: ${{ github.sha }}
        # Unquoted heredoc: secrets are expanded here and travel over stdin,
        # never as argv on the droplet. Remote-side variables are escaped.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
          set -euo pipefail
          cd ~/baes
          git fetch --quiet origin main
          git reset --quiet --hard "$SHA"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull --quiet server
          docker compose up -d --no-build server
          docker logout ghcr.io >/dev/null
          docker image prune -f >/dev/null
          EOF

      - name: Verify the deployed commit is serving
        env:
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 30); do
            body="$(curl -fsS "$PUBLIC_URL/api/health" || true)"
            if [[ "$body" == *"\"commit\":\"$SHA\""* ]]; then
              echo "live: $body"
              exit 0
            fi
            sleep 3
          done
          echo "::error::health check never reported commit $SHA (last: $body)"
          exit 1
