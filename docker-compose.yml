services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: baes
      POSTGRES_USER: baes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baes']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    # Built and pushed by CI on every push to main; `docker compose up --build`
    # still builds it locally under the same name.
    image: ghcr.io/xsebby/baes-server:latest
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://baes:${POSTGRES_PASSWORD}@db:5432/baes
      SERVER_SECRET: ${SERVER_SECRET:?set in .env}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      PORT: 4000
    volumes:
      # Music root on the VPS (PRD §5.1). Add more mounts for extra roots.
      - ${MUSIC_DIR:-/srv/music}:/srv/music:ro
      - app-data:/app/.data
      - transcode-cache:/app/transcode-cache

  # Nightly pg_dump + art to ./backups (see scripts/backup.sh). Runs as the
  # host's baes user (uid 1000, same as the image's node user) so it can read
  # app-data and the backups stay readable for scripts/pull-backup.sh.
  backup:
    image: postgres:16
    restart: unless-stopped
    user: '1000:1000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    entrypoint: ['sh', '/backup.sh']
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - app-data:/app-data:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  app-data:
  transcode-cache:
  caddy-data:
  caddy-config:
